<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Welfare Trust</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d7a7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Trust">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#2b2a27;--mute:#7a766d;--brand:#7a3e1d;--brand2:#b5651d;--teal:#0d7a7a;--tealD:#095c5c;--line:#e6e0d3;--ok:#2f6b3a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--brand);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1;line-height:1.25}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:13px}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.hero{text-align:center}
.logo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--brand2);background:#f0e9db;display:block;margin:0 auto 10px}
.hero h2{margin:6px 0;font-size:19px;letter-spacing:.3px;color:var(--brand)}
.addr{color:var(--mute);font-size:14px;white-space:pre-line}
.desc{margin-top:12px;text-align:left;font-size:15px;line-height:1.55;white-space:pre-line}
h3{margin:0 0 10px;font-size:16px;color:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer}
.btn.alt{background:#efe7d6;color:var(--brand)}
.btn.danger{background:#fbe9e7;color:#b3261e}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.teal{background:var(--teal)}
.founders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fbf8f1;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.pcard img,.ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#e8dfcc;display:block;margin:0 auto 8px}
.ph{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--brand2)}
.pcard .n{font-weight:600;font-size:15px}
.pcard .s{color:var(--mute);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{color:var(--brand);cursor:pointer;text-decoration:underline}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.dl b{color:var(--mute);font-weight:500}
.big{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#e8dfcc;display:block;margin:0 auto 10px}
.dead{border-color:#bdb6a5;filter:grayscale(.35)}
.tag{display:inline-block;font-size:11px;background:#efe7d6;color:var(--brand);border-radius:20px;padding:2px 8px;margin-top:4px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:90px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:10}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:520px;margin:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:14px}
.photoedit{display:flex;align-items:center;gap:12px}
.photoedit img,.photoedit .ph{margin:0;width:70px;height:70px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;background:#fbf8f1;border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;text-align:left}
.menu-item .ic{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.menu-item .t{font-weight:600;font-size:14.5px}
.menu-item .d{color:var(--mute);font-size:12.5px;margin-top:1px}
.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbf8f1;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px}
.listrow .main{flex:1;cursor:pointer}
.listrow .n{font-weight:600;font-size:15px}
.listrow .s{color:var(--mute);font-size:12.5px;margin-top:2px}
.iconbtn{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px;cursor:pointer}
.install-card{background:linear-gradient(135deg,var(--teal),var(--tealD));color:#fff;border-radius:12px;padding:16px}
.install-card h4{margin:0 0 6px;font-size:15px}
.install-card p{margin:0 0 10px;font-size:13px;opacity:.9;line-height:1.5}
.install-card .btn{background:#fff;color:var(--tealD);font-weight:600}
.badge-ok{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 10px;font-size:12px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <button id="backBtn" style="display:none">← Back</button>
  <h1 id="hTitle">Family Welfare Trust</h1>
  <button id="menuBtn">Menu</button>
</header>
<main id="app"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const STARS=["Ashwathi","Bharani","Karthika","Rohini","Makayiram","Thiruvathira","Punartham","Pooyam","Aayilyam","Makam","Pooram","Uthram","Atham","Chithira","Chothi","Visakham","Anizham","Thrikketta","Moolam","Pooradam","Uthradam","Thiruvonam","Avittam","Chathayam","Poororuttathi","Uthrittathi","Revathi"];
const BLOOD=["A+","A-","B+","B-","AB+","AB-","O+","O-"];
const RELS=["Son","Daughter","Wife","Husband","Son-in-law","Daughter-in-law","Grandson","Granddaughter","Great-grandson","Great-granddaughter","Other"];

/* ---------- storage (IndexedDB) ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('trustapp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function kvGet(k){return new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}
function kvSet(k,v){return new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res()})}

const DEFAULT_TRUST={name:"THANKAM KARUNNAAKARA PILLA FAMILY WELFARE TRUST",address:"",logo:"",description:"",deed:null};
let trust={...DEFAULT_TRUST};
let persons=[]; // {id,parent,founder,name,photo,address,blood,dob,relation,star,dod,dstar,mobile,education,job,aadhaar}
let items=[];   // trust-owned items: {id,name,qty,note}
let occasions=[]; // {id,name,date,notes,items:[{id,name,qty,note}]}  -- items here = "pooja saadhanangal"
let committee={president:'',vicePresident:'',secretary:'',jointSecretary:'',treasurer:'',members:[]}; // {id,name,role}
let view={type:'home',id:null};

async function load(){
  await openDB();
  trust={...DEFAULT_TRUST,...(await kvGet('trust')||{})};
  persons=(await kvGet('persons'))||[];
  items=(await kvGet('items'))||[];
  occasions=(await kvGet('occasions'))||[];
  committee={president:'',vicePresident:'',secretary:'',jointSecretary:'',treasurer:'',members:[],...(await kvGet('committee')||{})};
  ['F1','F2'].forEach((fid,i)=>{
    if(!persons.find(p=>p.id===fid)) persons.push(blank({id:fid,founder:true,name:i?'Mr. Karunnaakara Pilla':'Mrs. Thankam',relation:i?'Founder (Grandfather)':'Founder (Grandmother)'}));
  });
  render();
}
const saveTrust=()=>kvSet('trust',trust);
const savePersons=()=>kvSet('persons',persons);
const saveItems=()=>kvSet('items',items);
const saveOccasions=()=>kvSet('occasions',occasions);
const saveCommittee=()=>kvSet('committee',committee);
function blank(o){return Object.assign({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),parent:null,founder:false,name:'',photo:'',address:'',blood:'',dob:'',relation:'',star:'',dod:'',dstar:'',mobile:'',education:'',job:'',aadhaar:''},o)}
function newId(pfx){return pfx+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>persons.find(p=>p.id===id);
const kids=id=>persons.filter(p=>p.parent===id&&!p.founder);
const firstName=n=>(n||'').trim().split(/\s+/)[0]||'—';
function fmtDate(d){if(!d)return'—';const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function readImage(file,max=420){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}
function readFile(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res({name:file.name,type:file.type,data:fr.result});fr.readAsDataURL(file)})}
function avatar(p,cls=''){return p.photo?`<img class="${cls}" src="${p.photo}" alt="">`:`<div class="ph ${cls}">${esc((p.name||'?').trim()[0]||'?').toUpperCase()}</div>`}
function chain(id){const out=[];let p=byId(id);while(p){out.unshift(p);p=p.parent?byId(p.parent):null}return out}
function allPersons(){return persons}
function go(type,id=null){view={type,id};render();scrollTo(0,0)}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  $('#backBtn').style.display=view.type==='home'?'none':'';
  if(view.type==='home'){$('#hTitle').textContent=trust.name||'Family Welfare Trust';return renderHome(app);}
  if(view.type==='person')return renderPerson(app);
  if(view.type==='items'){$('#hTitle').textContent='Trust-owned Items';return renderItems(app);}
  if(view.type==='occasions'){$('#hTitle').textContent='Occasions & Poojas';return renderOccasions(app);}
  if(view.type==='occasion')return renderOccasion(app);
  if(view.type==='committee'){$('#hTitle').textContent='Committee';return renderCommittee(app);}
}

function renderHome(app){
  const f1=byId('F1'),f2=byId('F2');
  const top=persons.filter(p=>!p.founder&&!p.parent);
  const total=persons.filter(p=>!p.founder).length;
  app.innerHTML=`
  <div class="card hero">
    ${trust.logo?`<img class="logo" src="${trust.logo}" alt="Logo">`:`<div class="ph logo" style="font-size:12px;color:var(--mute)">No logo</div>`}
    <h2>${esc(trust.name)}</h2>
    <div class="addr">${trust.address?esc(trust.address):'Address not added yet'}</div>
    <div class="desc">${trust.description?esc(trust.description):'<span style="color:var(--mute)">Upload the trust deed and add a short description of the trust.</span>'}</div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn alt sm" onclick="editTrust()">Edit trust details</button>
      ${trust.deed?`<button class="btn alt sm" onclick="openDeed()">View trust deed</button>`:''}
    </div>
  </div>

  <div class="card">
    <h3>Founders</h3>
    <div class="founders">
      ${[f1,f2].map(p=>`<div class="pcard ${p.dod?'dead':''}" onclick="go('person','${p.id}')">${avatar(p)}<div class="n">${esc(p.name)}</div><div class="s">${p.founder?(p.relation||''):''}</div></div>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Trust members — children (${top.length})</h3>
      <button class="btn sm" onclick="editPerson(null,null)">+ Add son / daughter</button>
    </div>
    ${top.length?`<div class="grid">${top.map(cardHTML).join('')}</div>`:'<div class="empty">Add the sons and daughters of Mrs. Thankam and Mr. Karunnaakara Pilla. Open each name to add their family members.</div>'}
    <div class="note">${total} member${total===1?'':'s'} recorded in total.</div>
  </div>`;
}

function cardHTML(p){
  const n=kids(p.id).length;
  return `<div class="pcard ${p.dod?'dead':''}" onclick="go('person','${p.id}')">${avatar(p)}<div class="n">${esc(firstName(p.name))}</div><div class="s">${esc(p.relation||'')}${n?` · ${n} family`:''}</div>${p.dod?'<span class="tag">Late</span>':''}</div>`;
}

function renderPerson(app){
  const p=byId(view.id); if(!p){go('home');return}
  const ch=chain(p.id);
  const crumbs=`<div class="crumbs"><a onclick="go('home')">Home</a>${p.founder?'':ch.map(c=>` › <a onclick="go('person','${c.id}')">${esc(firstName(c.name))}</a>`).join('')}${p.founder?` › <b>${esc(firstName(p.name))}</b>`:''}</div>`;
  const kk=kids(p.id);
  app.innerHTML=`${crumbs}
  <div class="card ${p.dod?'dead':''}">
    ${p.photo?`<img class="big" src="${p.photo}">`:`<div class="ph big" style="font-size:40px">${esc((p.name||'?').trim()[0]||'?').toUpperCase()}</div>`}
    <h2 style="text-align:center;margin:0 0 12px;color:var(--brand)">${esc(p.name)||'Unnamed'}${p.dod?' <span class="tag">Late</span>':''}</h2>
    <div class="dl">
      <b>Relation</b><span>${esc(p.relation)||'—'}</span>
      <b>Mobile number</b><span>${esc(p.mobile)||'—'}</span>
      <b>Date of birth</b><span>${fmtDate(p.dob)}</span>
      <b>Birth star</b><span>${esc(p.star)||'—'}</span>
      <b>Blood group</b><span>${esc(p.blood)||'—'}</span>
      <b>Education</b><span>${esc(p.education)||'—'}</span>
      <b>Job / occupation</b><span>${esc(p.job)||'—'}</span>
      <b>Aadhaar number</b><span>${esc(p.aadhaar)||'—'}</span>
      <b>Address</b><span style="white-space:pre-line">${esc(p.address)||'—'}</span>
      ${p.dod?`<b>Date of death</b><span>${fmtDate(p.dod)}</span><b>Death star</b><span>${esc(p.dstar)||'—'}</span>`:''}
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn alt sm" onclick="editPerson('${p.id}')">Edit</button>
      ${p.founder?'':`<button class="btn danger sm" onclick="delPerson('${p.id}')">Delete</button>`}
    </div>
  </div>
  ${p.founder?'':`<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Family of ${esc(firstName(p.name))} (${kk.length})</h3>
      <button class="btn sm" onclick="editPerson(null,'${p.id}')">+ Add family member</button>
    </div>
    ${kk.length?`<div class="grid">${kk.map(cardHTML).join('')}</div>`:'<div class="empty">No family members added yet — spouse, children, etc. Each of them can have their own family too.</div>'}
  </div>`}`;
  $('#hTitle').textContent=firstName(p.name);
}

/* ---------- Trust-owned Items ---------- */
function renderItems(app){
  app.innerHTML=`<div class="crumbs"><a onclick="go('home')">Home</a> › <b>Trust-owned Items</b></div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Items owned by the trust (${items.length})</h3>
      <button class="btn sm" onclick="editItem(null)">+ Add item</button>
    </div>
    ${items.length?items.map(it=>`
      <div class="listrow">
        <div class="main" onclick="editItem('${it.id}')">
          <div class="n">${esc(it.name)}</div>
          <div class="s">${it.qty?esc(it.qty)+' · ':''}${esc(it.note)||''}</div>
        </div>
        <button class="iconbtn" onclick="delItem('${it.id}')" title="Delete">✕</button>
      </div>`).join(''):'<div class="empty">No items added yet — vessels, furniture, land documents, equipment, etc.</div>'}
    ${items.length?`<div class="row" style="margin-top:12px"><button class="btn teal sm" onclick="printItems()">🖨 Print item list</button></div>`:''}
  </div>`;
}
function editItem(id){
  const it=id?items.find(x=>x.id===id):{id:newId('it'),name:'',qty:'',note:''};
  tmp={isNew:!id,it};
  openModal(`<h3>${id?'Edit':'Add'} trust item</h3>
  <label>Item name</label><input id="i_name" value="${esc(it.name)}">
  <label>Quantity / description</label><input id="i_qty" placeholder="e.g. 2 sets, 1 acre, Reg. No. ..." value="${esc(it.qty)}">
  <label>Notes</label><textarea id="i_note">${esc(it.note)}</textarea>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="saveItem()">Save</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`);
}
async function saveItem(){
  const name=$('#i_name').value.trim();
  if(!name){alert('Please enter the item name');return}
  Object.assign(tmp.it,{name,qty:$('#i_qty').value.trim(),note:$('#i_note').value.trim()});
  if(tmp.isNew)items.push(tmp.it);
  await saveItems();closeModal();render();
}
async function delItem(id){
  if(!confirm('Delete this item?'))return;
  items=items.filter(x=>x.id!==id);await saveItems();render();
}

/* ---------- Occasions / Poojas ---------- */
function renderOccasions(app){
  const sorted=[...occasions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  app.innerHTML=`<div class="crumbs"><a onclick="go('home')">Home</a> › <b>Occasions & Poojas</b></div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Occasions (${occasions.length})</h3>
      <button class="btn sm" onclick="editOccasion(null)">+ Add occasion</button>
    </div>
    ${sorted.length?sorted.map(o=>`
      <div class="listrow">
        <div class="main" onclick="go('occasion','${o.id}')">
          <div class="n">${esc(o.name)}</div>
          <div class="s">${o.date?fmtDate(o.date)+' · ':''}${o.items.length} item${o.items.length===1?'':'s'} in Pooja Saadhanangal</div>
        </div>
        <button class="iconbtn" onclick="delOccasion('${o.id}')" title="Delete">✕</button>
      </div>`).join(''):'<div class="empty">Add an occasion — e.g. a pooja, function or ceremony — and list the items required for it.</div>'}
  </div>`;
}
function editOccasion(id){
  const o=id?occasions.find(x=>x.id===id):{id:newId('oc'),name:'',date:'',notes:'',items:[]};
  tmp={isNew:!id,o};
  openModal(`<h3>${id?'Edit':'Add'} occasion</h3>
  <label>Occasion name</label><input id="o_name" placeholder="e.g. Ganapathi Homam" value="${esc(o.name)}">
  <label>Date</label><input type="date" id="o_date" value="${esc(o.date)}">
  <label>Notes</label><textarea id="o_notes">${esc(o.notes)}</textarea>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="saveOccasion()">Save</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`);
}
async function saveOccasion(){
  const name=$('#o_name').value.trim();
  if(!name){alert('Please enter the occasion name');return}
  Object.assign(tmp.o,{name,date:$('#o_date').value,notes:$('#o_notes').value.trim()});
  if(tmp.isNew)occasions.push(tmp.o);
  await saveOccasions();closeModal();go('occasion',tmp.o.id);
}
async function delOccasion(id){
  if(!confirm('Delete this occasion and its item list?'))return;
  occasions=occasions.filter(x=>x.id!==id);await saveOccasions();render();
}
function renderOccasion(app){
  const o=occasions.find(x=>x.id===view.id); if(!o){go('occasions');return}
  $('#hTitle').textContent=o.name;
  app.innerHTML=`<div class="crumbs"><a onclick="go('home')">Home</a> › <a onclick="go('occasions')">Occasions & Poojas</a> › <b>${esc(o.name)}</b></div>
  <div class="card">
    <h2 style="margin:0 0 4px;color:var(--brand)">${esc(o.name)}</h2>
    <div class="addr">${o.date?fmtDate(o.date):'No date set'}</div>
    ${o.notes?`<div class="desc">${esc(o.notes)}</div>`:''}
    <div class="row" style="margin-top:12px">
      <button class="btn alt sm" onclick="editOccasion('${o.id}')">Edit occasion</button>
    </div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Pooja Saadhanangal (${o.items.length})</h3>
      <button class="btn sm" onclick="editOccItem('${o.id}',null)">+ Add item</button>
    </div>

async function delPerson(id){
  const all=[id];let i=0;while(i<all.length){persons.filter(x=>x.parent===all[i]).forEach(x=>all.push(x.id));i++}
  const extra=all.length-1;
  if(!confirm(`Delete ${byId(id).name}${extra?` and ${extra} family member(s) under them`:''}? This cannot be undone.`))return;
  const par=byId(id).parent;
  persons=persons.filter(x=>!all.includes(x.id));
  await savePersons();
  go(par?'person':'home',par);
}

function applyReportPreset(name){
  const keep=REPORT_PRESETS[name]||[];
  document.querySelectorAll('.rp_col').forEach(cb=>{cb.checked=keep.includes(cb.value)});
  const titles={directory:'Member Directory',birthstars:'Birth Star List',death:'Death Register',contact:'Contact List',profile:'Member Profile Report',full:'Full Member Report'};
  if(titles[name])$('#rp_title').value=titles[name];
  if(name==='death')$('#rp_who').value='deceased';
}
const REPORT_FIELD_DEFS={
  relation:p=>esc(p.relation)||'—',
  mobile:p=>esc(p.mobile)||'—',
  address:p=>p.address?esc(p.address).replace(/\n/g,'<br>'):'—',
  blood:p=>esc(p.blood)||'—',
  dob:p=>fmtDate(p.dob),
  star:p=>esc(p.star)||'—',
  education:p=>esc(p.education)||'—',
  job:p=>esc(p.job)||'—',

function printCustomReport(){
  const title=$('#rp_title').value.trim()||'Member Report';
  const who=$('#rp_who').value;
  const cols=[...document.querySelectorAll('.rp_col:checked')].map(c=>c.value);
  let list=persons;
  if(who==='living')list=list.filter(p=>!p.dod);
  if(who==='deceased')list=list.filter(p=>p.dod);
  if(!list.length){alert('No members match this selection.');return}
  const labelOf=k=>(REPORT_FIELDS.find(f=>f[0]===k)||[,k])[1];
  const head=`<th>Name</th>`+cols.map(c=>`<th>${labelOf(c)}</th>`).join('');
  const rows=list.map(p=>`<tr><td>${esc(p.name)||'—'}</td>${cols.map(c=>`<td>${REPORT_FIELD_DEFS[c](p)}</td>`).join('')}</tr>`).join('');
  printHTML(title, reportHead(title)+`<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`);
  closeModal();
}

/* ---------- Backup ---------- */
function openBackup(){openModal(`<h3>Backup & restore</h3>
  <p class="note" style="font-size:13px">All data is stored only in this browser/app on this device. Download a backup regularly (and to move the data to another phone or computer).</p>
  <div class="row"><button class="btn" onclick="exportData()">Download backup</button></div>
  <label>Restore from a backup file</label><input type="file" accept=".json" id="imp">
  <div class="row" style="margin-top:16px"><button class="btn alt" onclick="closeModal()">Close</button></div>`);
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='imp'||!e.target.files[0])return;
  try{
    const j=JSON.parse(await e.target.files[0].text());
    if(!j.trust||!j.persons)throw 0;
    if(!confirm('This will replace all data currently in the app. Continue?'))return;
    trust={...DEFAULT_TRUST,...j.trust};persons=j.persons;items=j.items||[];occasions=j.occasions||[];
    committee={president:'',vicePresident:'',secretary:'',jointSecretary:'',treasurer:'',members:[],...(j.committee||{})};
    await saveTrust();await savePersons();await saveItems();await saveOccasions();await saveCommittee();closeModal();go('home');
  }catch{alert('This file is not a valid backup.')}
});
function exportData(){
  const b=new Blob([JSON.stringify({trust,persons,items,occasions,committee,saved:new Date().toISOString()})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trust-family-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

/* ---------- Install App (PWA) ---------- */
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredInstallPrompt=e;});
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function openInstall(){
  if(isStandalone()){
    openModal(`<h3>Install App</h3><div class="install-card"><span class="badge-ok">✓ Already installed</span><p>This app is already installed and running as an app on this device.</p></div>
    <div class="row" style="margin-top:16px"><button class="btn alt" onclick="closeModal()">Close</button></div>`);
    return;
  }
  if(isIOS()){
    openModal(`<h3>Install App</h3>
    <div class="install-card">
      <h4>Add to Home Screen (iPhone/iPad)</h4>
      <p>iOS doesn't support a one-tap install button, but adding this app takes a few seconds:</p>
      <div class="dl" style="color:#fff">
        <b style="color:#fff">1.</b><span>Tap the <b>Share</b> icon (square with an arrow) in Safari's toolbar</span>
        <b style="color:#fff">2.</b><span>Scroll down and tap <b>"Add to Home Screen"</b></span>
        <b style="color:#fff">3.</b><span>Tap <b>Add</b> — the app icon will appear on your home screen</span>
      </div>
    </div>
    <p class="note">Must be opened in Safari (not Chrome) for this option to appear on iOS.</p>
    <div class="row" style="margin-top:16px"><button class="btn alt" onclick="closeModal()">Close</button></div>`);
    return;
  }
  openModal(`<h3>Install App</h3>
  <div class="install-card">
    <h4>Install on this device</h4>
    <p>Installs the app icon on your home screen / app list. It will open full-screen and work offline, just like a native app — no browser address bar.</p>
    <button class="btn" id="doInstallBtn" onclick="doInstall()">${deferredInstallPrompt?'Install now':'Install (open menu ⋮ → Install app)'}</button>
  </div>
  <p class="note">${deferredInstallPrompt?'Tap Install, then confirm in the dialog that appears.':"If the button doesn't install directly, use your browser's menu (⋮ or •••) and choose \"Install app\" or \"Add to Home screen\"."}</p>
  <div class="row" style="margin-top:16px"><button class="btn alt" onclick="closeModal()">Close</button></div>`);
}
async function doInstall(){
  if(!deferredInstallPrompt){return}
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  closeModal();
}
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;});

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

load();
</script>
